[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.18"
optimizer = false
evm_version = "london"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@clones/=lib/clones-with-immutable-args/src/",
    "@prb-math/contracts/=lib/prb-math/contracts/",
]
